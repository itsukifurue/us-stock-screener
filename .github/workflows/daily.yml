name: Daily US Stock Screening

# 毎週月〜金 12:00 UTC = 日本時間21:00 に実行(パソコンの電源状態に関係なくGitHub側で実行される)
on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}  # GitHubの画面から手動実行もできるようにする

permissions:
  contents: write  # レポートをリポジトリへcommit/pushするために必要

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screening pipeline
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FMP_BASE_URL: https://financialmodelingprep.com/stable
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
        run: python main.py

      - name: Commit and push report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "Daily report $(date +'%Y-%m-%d')"
          git push
